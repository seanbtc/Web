<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BStrategy之家</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%233b82f6' d='M16 2L2 8v16l14 6 14-6V8L16 2zm0 22l-8-3v-10l8-4 8 4v10l-8 3z'/%3E%3Cpath fill='%23ffffff' d='M16 8l-6 2.5v9L16 22l6-2.5v-9L16 8z'/%3E%3Cpath fill='%233b82f6' d='M16 10l-4 1.5v6L16 20l4-1.5v-6L16 10z'/%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #020617 100%);
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #e2e8f0;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 36px 32px 32px;
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }
        .login-card h1 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .login-card .subtitle {
            margin: 0 0 22px;
            font-size: 13px;
            color: #94a3b8;
        }
        .error {
            margin-bottom: 16px;
            padding: 10px 12px;
            font-size: 13px;
            color: #fecaca;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 14px;
            font-size: 13px;
            color: #cbd5e1;
        }
        input[type="text"], input[type="password"] {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            font-size: 14px;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
        }
        button {
            width: 100%;
            margin-top: 6px;
            padding: 11px 14px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>BStrategy之家</h1>
        <p class="subtitle">请登录后查看面板</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <label>
                用户名
                <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" autofocus>
            </label>
            <label>
                密码
                <input type="password" name="password" autocomplete="current-password">
            </label>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
