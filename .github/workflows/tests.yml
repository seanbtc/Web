name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask flask-socketio requests markdown pygments

      - name: Run tests
        env:
          WEB_DISABLE_EVENTLET: "1"
          WEB_SESSION_SECRET: "ci-session-secret"

        run: python -m pytest tests -q
